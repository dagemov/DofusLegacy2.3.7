<div class="card admin-card border-0">
  <div class="card-body d-grid gap-3">
    <div class="d-flex flex-column flex-md-row justify-content-between gap-2">
      <div>
        <p class="text-uppercase small fw-semibold text-secondary mb-1">Auditoría rápida (batch)</p>
        <h3 class="h6 mb-0">Muestra QA: {{ sampleIds.join(', ') }}</h3>
        <p class="text-secondary small mb-0">Solo IDs curados. No escanea catálogos masivos.</p>
      </div>
      <div class="d-flex flex-wrap gap-2">
        <button type="button" class="btn btn-sm btn-outline-secondary" (click)="toggle()">
          {{ expanded ? 'Ocultar' : 'Mostrar' }}
        </button>
        <button
          type="button"
          class="btn btn-sm btn-primary"
          [disabled]="isLoading"
          (click)="loadSample()">
          {{ isLoading ? 'Cargando...' : 'Ejecutar muestra' }}
        </button>
      </div>
    </div>

    <app-api-problem-panel [problem]="problem"></app-api-problem-panel>

    <div *ngIf="expanded && results.length > 0" class="table-responsive">
      <table class="table table-sm align-middle mb-0">
        <thead class="table-light">
          <tr>
            <th>ItemId</th>
            <th>Estado</th>
            <th>Cliente</th>
            <th>Preview</th>
            <th></th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let row of results">
            <td class="font-monospace-soft">{{ row.itemId }}</td>
            <td>
              <span class="badge" [class]="statusBadgeClass(row.status.primaryStatus)">
                {{ statusLabel(row.status.primaryStatus) }}
              </span>
            </td>
            <td>{{ row.clientKnown ? 'Sí' : 'No' }}</td>
            <td>{{ row.iconPreviewFound ? 'OK' : '—' }}</td>
            <td>
              <a class="btn btn-sm btn-link" [routerLink]="['/admin/items', row.itemId]">Detalle</a>
            </td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>
</div>
